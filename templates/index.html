<!DOCTYPE html>
<html>
<head>
    <title>PDF Extractor</title>
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Upload a PDF to Extract Information</h1>
        <form id="upload-form" enctype="multipart/form-data" method="post">
            <input name="file" type="file" id="file-input" accept=".pdf" required>
            <button type="submit">Upload and Process</button>
        </form>

        <div id="results-container" style="display: none;">
            <div class="pdf-viewer">
                <iframe id="pdf-iframe" width="100%" height="600px"></iframe>
            </div>
            <div class="extracted-content">
                <h2>Extracted Text (PyMuPDF)</h2>
                <div id="initial-text"></div>
                
                <div id="ai-results" style="display: none;">
                    <h2>General PDF Description</h2>
                    <div id="general-description"></div>
                    <h2>Extracted Text (Ollama OCR)</h2>
                    <div id="ocr-text"></div>
                    <div id="image-interpretation-section">
                        <h2>Image Interpretations</h2>
                        <div id="image-interpretations"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loading-indicator" style="display: none;">
        <div class="animated-icon"></div>
        <p id="loading-message">AI is processing...</p>
    </div>

    <script>
        const loadingMessages = [
            "AI is processing...",
            "Analyzing document content...",
            "Extracting text and images...",
            "Applying advanced OCR...",
            "Interpreting visual information...",
            "Almost there..."
        ];
        let messageIndex = 0;
        let messageInterval;

        document.getElementById('upload-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select a PDF file.');
                return;
            }

            document.getElementById('results-container').style.display = 'block';
            const pdf_b64 = await toBase64(file);
            document.getElementById('pdf-iframe').src = `data:application/pdf;base64,${pdf_b64}`;

            document.getElementById('loading-indicator').style.display = 'flex'; // Use flex for centering
            document.getElementById('ai-results').style.display = 'none';

            // Start rotating messages
            messageIndex = 0;
            document.getElementById('loading-message').textContent = loadingMessages[messageIndex];
            messageInterval = setInterval(() => {
                messageIndex = (messageIndex + 1) % loadingMessages.length;
                document.getElementById('loading-message').textContent = loadingMessages[messageIndex];
            }, 3000); // Change message every 3 seconds

            const initialResponse = await fetch('/upload/', {
                method: 'POST',
                body: formData
            });

            const initialData = await initialResponse.json();
            if (initialData.error) {
                alert(`Error: ${initialData.error}`);
                document.getElementById('loading-indicator').style.display = 'none';
                clearInterval(messageInterval);
                return;
            }
            document.getElementById('initial-text').innerHTML = initialData.initial_text;

            const aiResponse = await fetch('/process_ai/', {
                method: 'POST',
                body: formData
            });

            clearInterval(messageInterval); // Stop rotating messages

            const aiData = await aiResponse.json();
            if (aiData.error) {
                alert(`Error: ${aiData.error}`);
            } else {
                document.getElementById('general-description').innerHTML = aiData.general_description;
                document.getElementById('ocr-text').innerHTML = aiData.ocr_text;
                const imageContainer = document.getElementById('image-interpretations');
                imageContainer.innerHTML = '';

                const imageSection = document.getElementById('image-interpretation-section');
                if (aiData.image_interpretations.length > 0) {
                    imageSection.style.display = 'block';
                    aiData.image_interpretations.forEach(img => {
                        const imgElement = document.createElement('div');
                        imgElement.innerHTML = `
                            <h4>Extracted Image ${img.index} on Page ${img.page}</h4>
                            <img src="${img.src}" style="max-width: 100%; border: 1px solid #ccc; margin-bottom: 10px;">
                            <div><h5>Image Interpretation:</h5>${img.interpretation}</div>
                        `;
                        imageContainer.appendChild(imgElement);
                    });
                } else {
                    imageSection.style.display = 'none';
                }
            }

            document.getElementById('loading-indicator').style.display = 'none';
            document.getElementById('ai-results').style.display = 'block';
        });

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    </script>
</body>
</html>
